[project]
name = "company-os-runtime"
version = "0.1.0"
description = "LangGraph/LangChain runtime stub for ApiLens Platform Company OS"
requires-python = ">=3.11"
dependencies = [
    "langchain>=0.3",
    "langgraph>=0.2",
    "langsmith>=0.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]
dev = [
    "pytest>=8.0",
]

[tool.uv]
package = false
