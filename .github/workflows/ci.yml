name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    # The index store and HTTP API tests also run against PostgreSQL.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tacet
          POSTGRES_PASSWORD: tacet
          POSTGRES_DB: tacet
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tacet" --health-interval 2s --health-timeout 5s --health-retries 15
    env:
      TACET_TEST_POSTGRES_URL: postgres://tacet:tacet@localhost:5432/tacet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - uses: astral-sh/setup-uv@v6
      - run: npm ci
      - name: Build and test the Java extractor
        run: |
          npm run build:jar
          npm run test:jvm
      - run: npm run build
      - run: npm test
      - name: Python bindings (FastMCP)
        working-directory: python
        run: uv run --group dev pytest -q
      - name: Gradle plugin
        working-directory: plugins/gradle
        run: ./gradlew test validatePlugins
      - name: Maven plugin
        working-directory: plugins/maven
        run: mvn -B verify
      - name: Smoke-test the CLI on the fixtures
        run: |
          node packages/cli/dist/bin.js index test/fixtures/frontend --config test/fixtures/tacet.config.json
          node packages/cli/dist/bin.js extract-backend test/fixtures/backend
          # The fixture frontend contains deliberate contract violations.
          node packages/cli/dist/bin.js check --fail-on never
          node packages/cli/dist/bin.js graph -o .tacet/graph.html
      - uses: actions/upload-artifact@v4
        if: matrix.node == 24
        with:
          name: tacet-graph
          path: .tacet/graph.html
