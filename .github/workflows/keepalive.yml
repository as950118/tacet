name: Keep alive

# Render's free web service sleeps after 15 minutes without requests, and Supabase's free project pauses after a week
# without database activity. /health/db answers only after one query on the index database, so one ping covers both.
# GitHub may delay scheduled runs by several minutes, so the interval stays well under 15.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the API and its database
        env:
          # Repository variable (Settings → Secrets and variables → Actions → Variables), e.g. https://tacet-api.onrender.com
          API_URL: ${{ vars.TACET_API_URL }}
        run: |
          [ -n "$API_URL" ] || { echo "Set the repository variable TACET_API_URL" >&2; exit 1; }
          # A sleeping instance needs about a minute to wake up, so retry instead of failing on the first timeout.
          curl --fail --silent --show-error --retry 5 --retry-delay 20 --retry-all-errors --max-time 90 "$API_URL/health/db"
